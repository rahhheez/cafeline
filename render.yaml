services:
  - type: web
    name: cafaline-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn backend.wsgi:application
    healthCheckPath: /api/menu/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: cafaline-db
          property: connectionString

  - type: web
    name: cafaline-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cafaline-api.onrender.com/api/
      - key: VITE_EMAILJS_SERVICE_ID
        value: service_64zdc78
      - key: VITE_EMAILJS_PUBLIC_KEY
        value: IvZIeFICTafRQRlKP
      - key: VITE_EMAILJS_ORDER_TEMPLATE_ID
        value: template_hldtgsr
      - key: VITE_EMAILJS_CONTACT_TEMPLATE_ID
        value: template_hldtgsr
      - key: VITE_ORDER_EMAIL_TO
        sync: false
      - key: VITE_PAYMENT_GATEWAY_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cafaline-db
    databaseName: cafaline
    user: cafaline
